$homeshell_border_accent = rgba(9fcddedd)
$homeshell_red = rgb(ffb4ab)

general {
    border_size = 3
    col.active_border = rgba(9fcddedd)
    col.inactive_border = rgba(9fcdde6b)
}

group {
    col.border_active = rgba(9fcddedd) rgba(b9c9d0cc) 45deg
    col.border_inactive = rgba(9fcdde6b)
    col.border_locked_active = rgba(c2c3ebff)
    col.border_locked_inactive = rgba(9fcdde6b)
}
