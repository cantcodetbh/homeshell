# Optional HomeShell Quickshell integration.
# Apply-live installs this as ~/.config/hypr/conf/homeshell-quickshell.conf.

source = ~/.config/hypr/conf/homeshell-theme.conf

layerrule = animation fade, match:namespace quickshell-bar
layerrule = animation fade, match:namespace quickshell-drawer
layerrule = animation fade, match:namespace quickshell-power
layerrule = blur on, match:namespace quickshell-power
layerrule = blur on, match:namespace quickshell-drawer

bind = SUPER, Grave, exec, ~/gowild/homeshell/scripts/launch
bind = SUPER SHIFT, W, exec, ~/gowild/homeshell/scripts/wallpaper next
bind = SUPER SHIFT, S, exec, ~/gowild/homeshell/scripts/launch
bind = SUPER SHIFT, X, exec, ~/gowild/homeshell/scripts/stop
